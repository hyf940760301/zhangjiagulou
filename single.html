<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>张家古楼 · 七层环视</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#08090b;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#d8cbb4}
  #stage{position:absolute;inset:0}
  #stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .4s ease}
  #stage img.on{opacity:1}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 40%,rgba(0,0,0,.75) 100%)}
  #hud{position:absolute;left:22px;top:18px;pointer-events:none}
  #hud h1{font-size:17px;font-weight:600;letter-spacing:.16em;color:#e8dcc4}
  #hud p{font-size:12px;color:#9c8f78;margin-top:5px}
  #vname{font-size:12px;color:#c9a86a;margin-top:9px;letter-spacing:.1em}
  #map{position:absolute;right:22px;top:18px;width:184px;height:184px;
    background:rgba(10,10,12,.72);border:1px solid rgba(190,170,130,.22);border-radius:3px}
  #map svg{width:100%;height:100%;display:block}
  #map .pt{fill:#7a6a4e;cursor:pointer}
  #map .pt:hover{fill:#c9a86a}
  #map .pt.on{fill:#f0c070}
  #map .fov{stroke:rgba(240,192,112,.75);stroke-width:1;fill:rgba(240,192,112,.10)}
  #floors{position:absolute;left:22px;bottom:78px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
  #floors button{background:rgba(24,22,19,.82);border:1px solid rgba(190,170,130,.28);
    color:#d8c8a8;padding:5px 11px;border-radius:3px;cursor:pointer;font-size:12px}
  #floors button:hover{border-color:rgba(220,200,160,.7)}
  #floors button.on{background:rgba(150,120,70,.42);border-color:rgba(220,200,160,.85);color:#fff}
  #nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;
    align-items:center;justify-content:center;padding:16px;
    background:linear-gradient(transparent,rgba(0,0,0,.78))}
  #nav button{background:rgba(24,22,19,.82);border:1px solid rgba(190,170,130,.28);
    color:#d8c8a8;padding:7px 15px;border-radius:3px;cursor:pointer;font-size:13px}
  #nav button:hover{border-color:rgba(220,200,160,.7);color:#fff}
  #bar{position:absolute;left:0;right:0;bottom:64px;height:2px;background:rgba(255,255,255,.06)}
  #bar i{display:block;height:100%;background:#c9a86a;width:0;transition:width .25s}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#8b7f68;letter-spacing:.1em;background:#08090b;z-index:9}
</style>
</head>
<body>
<div id="loading">载入中…</div>
<div id="stage"></div>
<div id="vignette"></div>
<div id="hud"><h1>张家古楼</h1><p>巴乃 · 七层 · 深度引导重建</p><div id="vname">—</div></div>
<div id="map"><svg id="mapsvg" viewBox="-19 -19 38 38"></svg></div>
<div id="floors"></div>
<div id="bar"><i></i></div>
<div id="nav"><button id="prev">←</button><button id="next">→</button></div>

<script type="module">
const FLOOR_NAMES = {1:'一层 · 大殿四柱',2:'二层 · 密洛陀',3:'三层 · 人面龟',4:'四层 · 千棺',
                     5:'五层 · 夹层',6:'六层 · 藏宝',7:'七层 · 终极'};
const payload = [{"floor": 1, "views": [{"i": 0, "name": "01-俯视45", "file": "f1-00.jpg", "pos": [13.5, 9.2, 13.5], "q": [-0.18052, 0.34408, 0.06759, 0.91894]}, {"i": 1, "name": "02-俯视45反", "file": "f1-01.jpg", "pos": [13.5, 9.0, -13.5], "q": [-0.09008, 0.88667, 0.19507, 0.40945]}, {"i": 2, "name": "04-高位斜", "file": "f1-02.jpg", "pos": [9.0, 7.5, -6.0], "q": [-0.10031, 0.86907, 0.19699, 0.44255]}, {"i": 3, "name": "05-高位斜反", "file": "f1-03.jpg", "pos": [-9.0, 7.8, -2.0], "q": [-0.1749, -0.63361, -0.15005, 0.73854]}, {"i": 4, "name": "06-门内平视", "file": "f1-04.jpg", "pos": [0.0, 1.7, 14.6], "q": [0.05506, 0.0, 0.0, 0.99848]}, {"i": 5, "name": "H-角部中位", "file": "f1-07.jpg", "pos": [13.0, 4.5, -13.0], "q": [-0.01233, 0.94202, 0.03482, 0.33351]}]}, {"floor": 2, "views": [{"i": 0, "name": "01-高空俯视", "file": "f2-00.jpg", "pos": [13.0, 8.4, 13.0], "q": [-0.18538, 0.3582, 0.0728, 0.91216]}, {"i": 1, "name": "02-反向俯视", "file": "f2-01.jpg", "pos": [-12.5, 8.3, -12.5], "q": [-0.0743, -0.91155, -0.18961, 0.35721]}, {"i": 2, "name": "04-高位斜", "file": "f2-02.jpg", "pos": [10.5, 7.2, -4.0], "q": [-0.07911, 0.87918, 0.15705, 0.44286]}, {"i": 3, "name": "05-中轴纵深", "file": "f2-03.jpg", "pos": [0.0, 1.7, 13.5], "q": [0.02763, 0.0, 0.0, 0.99962]}, {"i": 4, "name": "06-中轴反向", "file": "f2-04.jpg", "pos": [0.0, 1.7, -13.5], "q": [-0.0, -0.99962, 0.02763, -0.0]}, {"i": 5, "name": "09-门前高位", "file": "f2-05.jpg", "pos": [0.0, 8.0, 14.0], "q": [-0.18911, 0.0, 0.0, 0.98196]}]}, {"floor": 3, "views": [{"i": 0, "name": "01-正面", "file": "f3-00.jpg", "pos": [0.0, 1.7, 11.5], "q": [0.02172, 0.0, 0.0, 0.99976]}, {"i": 1, "name": "02-侧面", "file": "f3-01.jpg", "pos": [11.0, 1.7, -0.5], "q": [0.01567, 0.7228, -0.0164, 0.69069]}, {"i": 2, "name": "03-背面", "file": "f3-02.jpg", "pos": [0.0, 1.7, -11.5], "q": [-0.0, -0.99976, 0.02172, -0.0]}, {"i": 3, "name": "05-头颈", "file": "f3-03.jpg", "pos": [-6.0, 3.0, 9.0], "q": [0.0, -0.31623, 0.0, 0.94868]}, {"i": 4, "name": "06-另一侧", "file": "f3-04.jpg", "pos": [-11.5, 1.7, 0.0], "q": [0.01536, -0.70694, 0.01536, 0.70694]}, {"i": 5, "name": "07-高位正", "file": "f3-05.jpg", "pos": [0.0, 5.5, 9.0], "q": [-0.20759, 0.0, 0.0, 0.97822]}]}, {"floor": 4, "views": [{"i": 0, "name": "01-主走道", "file": "f4-00.jpg", "pos": [0.0, 1.6, 13.5], "q": [-0.00392, 0.0, 0.0, 0.99999]}, {"i": 1, "name": "02-反向", "file": "f4-01.jpg", "pos": [0.0, 1.6, -12.0], "q": [-0.0, -0.99999, -0.00417, 0.0]}, {"i": 2, "name": "03-横走道", "file": "f4-02.jpg", "pos": [-12.0, 1.6, 0.0], "q": [-0.00295, -0.7071, -0.00295, 0.7071]}, {"i": 3, "name": "04-侧走廊", "file": "f4-03.jpg", "pos": [5.5, 1.6, -12.0], "q": [-0.0, -0.99999, -0.00417, 0.0]}, {"i": 4, "name": "05-高位", "file": "f4-04.jpg", "pos": [0.0, 3.4, 12.0], "q": [-0.06704, 0.0, 0.0, 0.99775]}, {"i": 5, "name": "06-斜穿", "file": "f4-05.jpg", "pos": [-2.75, 1.6, 13.5], "q": [-0.00465, 0.0, 0.0, 0.99999]}]}, {"floor": 5, "views": [{"i": 0, "name": "01-爬向口子", "file": "f5-00.jpg", "pos": [0.0, 0.62, 13.5], "q": [-0.01799, 0.0, 0.0, 0.99984]}, {"i": 1, "name": "02-横爬", "file": "f5-01.jpg", "pos": [-13.0, 0.62, 0.0], "q": [-0.00415, -0.70709, -0.00415, 0.70709]}, {"i": 2, "name": "03-贴地", "file": "f5-02.jpg", "pos": [-4.0, 0.42, 3.0], "q": [-0.00319, -0.88915, -0.0062, 0.45757]}, {"i": 3, "name": "04-斜爬", "file": "f5-03.jpg", "pos": [9.0, 0.66, -9.0], "q": [-0.0028, 0.92385, 0.00675, 0.38267]}, {"i": 4, "name": "05-反向", "file": "f5-04.jpg", "pos": [0.0, 0.62, -13.5], "q": [-0.0, -0.99997, -0.00771, 0.0]}, {"i": 5, "name": "06-俯看口子", "file": "f5-05.jpg", "pos": [2.6, 1.05, 8.0], "q": [-0.13487, 0.69413, 0.13487, 0.69413]}]}, {"floor": 6, "views": [{"i": 0, "name": "02-反向", "file": "f6-00.jpg", "pos": [0.0, 1.7, -9.6], "q": [-0.0, -0.99974, 0.02294, -0.0]}, {"i": 1, "name": "03-横轴", "file": "f6-01.jpg", "pos": [-9.6, 1.7, 0.0], "q": [0.01622, -0.70692, 0.01622, 0.70692]}, {"i": 2, "name": "04-高位俯", "file": "f6-02.jpg", "pos": [12.0, 5.2, 12.0], "q": [-0.11323, 0.36144, 0.04427, 0.92444]}, {"i": 3, "name": "05-铃下", "file": "f6-03.jpg", "pos": [0.0, 1.7, 6.5], "q": [0.16246, 0.0, 0.0, 0.98672]}, {"i": 4, "name": "06-箱柜", "file": "f6-04.jpg", "pos": [-3.0, 1.7, 8.5], "q": [-0.00798, -0.4904, -0.00449, 0.87145]}]}, {"floor": 7, "views": [{"i": 0, "name": "01-正对棺", "file": "f7-00.jpg", "pos": [0.0, 1.7, 8.2], "q": [0.03651, 0.0, 0.0, 0.99933]}, {"i": 1, "name": "02-侧", "file": "f7-01.jpg", "pos": [8.2, 1.7, -1.0], "q": [0.02403, 0.74819, -0.02714, 0.66249]}, {"i": 2, "name": "03-背", "file": "f7-02.jpg", "pos": [0.0, 1.7, -8.2], "q": [-0.0, -0.99933, 0.03651, -0.0]}, {"i": 3, "name": "04-高位俯", "file": "f7-03.jpg", "pos": [7.5, 6.2, 7.5], "q": [-0.18048, 0.37531, 0.07476, 0.90608]}, {"i": 4, "name": "05-仰看顶口", "file": "f7-04.jpg", "pos": [0.0, 1.7, 5.0], "q": [0.43494, 0.0, 0.0, 0.90046]}]}];
const data = payload.map(p => p.views);
const floorNo = payload.map(p => p.floor);
const stage = document.getElementById('stage');
const svg = document.getElementById('mapsvg');
const NS = 'http://www.w3.org/2000/svg';
const mk = (t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

let fi = 0, vi = 0, imgs = [], pts = [], fovG = null;

function buildFloor(k) {
  stage.innerHTML = ''; svg.innerHTML = ''; imgs = []; pts = [];
  const vs = data[k];
  const S = (floorNo[k] === 1) ? 15 : 12;      // 一层已重构为 30×30
  svg.appendChild(mk('rect',{x:-S,y:-S,width:S*2,height:S*2,fill:'none',
    stroke:'rgba(190,170,130,.18)',strokeWidth:0.35}));
  if (floorNo[k] === 1) {
    svg.appendChild(mk('ellipse',{cx:0,cy:0,rx:4.6,ry:4.6,fill:'none',
      stroke:'rgba(150,180,220,.22)',strokeWidth:0.25}));
  } else {
    svg.appendChild(mk('rect',{x:-3,y:-3,width:6,height:6,fill:'none',
      stroke:'rgba(150,180,220,.22)',strokeWidth:0.25}));
  }
  fovG = mk('path',{class:'fov'}); svg.appendChild(fovG);
  vs.forEach((v,i)=>{
    const im=document.createElement('img');
    im.src=`https://raw.githubusercontent.com/hyf940760301/zhangjiagulou/main/img/${v.file}`; im.dataset.i=i;
    stage.appendChild(im); imgs.push(im);
    const c=mk('circle',{class:'pt',cx:v.pos[0],cy:v.pos[2],r:0.42});
    c.addEventListener('click',()=>show(i));
    svg.appendChild(c); pts.push(c);
  });
  document.querySelectorAll('#floors button').forEach((b,i)=>b.classList.toggle('on',i===k));
  show(0);
}

function fovPath(v){
  const [x,,z]=v.pos,[qx,qy,qz,qw]=v.q;
  const fx=-2*(qx*qz+qw*qy);
  const fz=-(1-2*(qx*qx+qy*qy));
  const ang=Math.atan2(fz,fx),R=(floorNo[fi]===1?4.5:3.4),half=0.42;
  const a1=ang-half,a2=ang+half;
  return `M ${x} ${z} L ${x+R*Math.cos(a1)} ${z+R*Math.sin(a1)} L ${x+R*Math.cos(a2)} ${z+R*Math.sin(a2)} Z`;
}
function show(i){
  const n=imgs.length; vi=(i+n)%n;
  imgs.forEach((im,j)=>im.classList.toggle('on',j===vi));
  pts.forEach((p,j)=>p.classList.toggle('on',j===vi));
  fovG.setAttribute('d',fovPath(data[fi][vi]));
  document.getElementById('vname').textContent=
    `${FLOOR_NAMES[floorNo[fi]]} · 机位 ${vi+1}/${n} · ${data[fi][vi].name}`;
  document.querySelector('#bar i').style.width=((vi+1)/n*100)+'%';
}

const fb=document.getElementById('floors');
payload.forEach((p,i)=>{
  const b=document.createElement('button'); b.textContent=FLOOR_NAMES[p.floor];
  b.onclick=()=>{fi=i;buildFloor(i);};
  fb.appendChild(b);
});
document.getElementById('prev').onclick=()=>show(vi-1);
document.getElementById('next').onclick=()=>show(vi+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')show(vi-1);
  if(e.key==='ArrowRight')show(vi+1);
  if(e.key==='ArrowUp'){fi=Math.max(0,fi-1);buildFloor(fi);}
  if(e.key==='ArrowDown'){fi=Math.min(data.length-1,fi+1);buildFloor(fi);}
});
buildFloor(0);
document.getElementById('loading').style.display='none';
document.title='READY floors='+data.length;
</script>
</body>
</html>
